[project]
name = "ptychoml"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "BOWENmeZHENG", email = "bowenzheng01@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "cdtools-py>=0.3.2",
    "dlsia>=0.3.4",
    "dvc>=3.67.1",
    "evidently>=0.7.20",
    "fastapi>=0.128.8",
    "mlflow>=3.1.4",
    "pandas>=2.3.3",
    "pyarrow>=20.0.0",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "torch>=2.8.0",
    "tqdm>=4.66.0",
    "uvicorn>=0.39.0",
]

[project.scripts]
ptychoml = "ptychoml:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
