stages:
  prepare:
    cmd: python -m ptychoml.data.prepare --save-dir data/processed/BBBC002_m${prepare.crops_per_image}_N${prepare.crop_size}_step${prepare.step}_seed${prepare.seed}
    deps:
      - src/ptychoml/data/prepare.py
      - src/ptychoml/data/objects.py
      - src/ptychoml/data/simulate.py
      - data/raw
    params:
      - prepare.crops_per_image
      - prepare.crop_size
      - prepare.seed
      - prepare.step
    outs:
      - data/processed/BBBC002_m${prepare.crops_per_image}_N${prepare.crop_size}_step${prepare.step}_seed${prepare.seed}
